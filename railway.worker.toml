# Dedicated audit worker service. Same image as web, different start command.
# Required for all deployments. In Railway: create a service from this repo and
# set Config path to /railway.worker.toml. Deploy more workers as needed;
# they all consume the same Redis queue and one runs recovery (lock-guarded).
# Requires the same env as web: DATABASE_URL, REDIS_URL (and optionally an AI key).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/bin/sh -c \"npm run worker:start\""
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.env]
FIXFLAGS_PROCESS_ROLE = "worker"
AUDIT_WORKER_CONCURRENCY = "2"
