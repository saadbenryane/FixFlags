name: 'FixFlags Check'
description: 'Run a FixFlags Launch Check on a deployed preview URL'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  url:
    description: 'Public HTTPS URL to check (preview deploy, staging tunnel, or production)'
    required: true
  api-key:
    description: 'FixFlags API key (ff_live_...)'
    required: true
  mode:
    description: 'single or critical_path'
    required: false
    default: 'critical_path'
  wait-for-completion:
    description: 'Wait for the report to finish'
    required: false
    default: 'true'
  fail-on-issues:
    description: 'Fail the workflow when the Finish Plan has blocking issues'
    required: false
    default: 'false'
  base-url:
    description: 'FixFlags API base URL'
    required: false
    default: 'https://fixflags.com'

runs:
  using: 'composite'
  outputs:
    report_id:
      description: 'FixFlags report id'
      value: ${{ steps.check.outputs.report_id }}
    report_url:
      description: 'Public report URL'
      value: ${{ steps.check.outputs.report_url }}
  steps:
    - name: Install FixFlags CLI
      shell: bash
      run: npm install -g fixflags@0.2.0-beta.1

    - name: Run FixFlags check
      shell: bash
      env:
        FIXFLAGS_API_KEY: ${{ inputs.api-key }}
        FIXFLAGS_API_URL: ${{ inputs.base-url }}
      run: |
        set -euo pipefail
        ARGS=(check "${{ inputs.url }}" --json)
        if [ "${{ inputs.mode }}" = "single" ]; then
          ARGS+=(--mode single)
        fi
        if [ "${{ inputs.wait-for-completion }}" = "true" ]; then
          ARGS+=(--wait)
        fi
        OUT="$(fixflags "${ARGS[@]}")"
        echo "$OUT"
        REPORT_ID="$(node -e 'const o=JSON.parse(process.argv[1]); process.stdout.write(o.reportId||"")' "$OUT")"
        echo "report_id=$REPORT_ID" >> "$GITHUB_OUTPUT"
        echo "report_url=${FIXFLAGS_API_URL%/}/report/$REPORT_ID" >> "$GITHUB_OUTPUT"
        if [ "${{ inputs.fail-on-issues }}" = "true" ]; then
          node -e '
            const o = JSON.parse(process.argv[1]);
            const items = o.finishPlan?.items ?? [];
            if (items.length > 0) process.exit(1);
          ' "$OUT"
        fi
      id: check

    - name: Summary
      shell: bash
      run: |
        echo "### FixFlags report" >> "$GITHUB_STEP_SUMMARY"
        echo "${{ steps.check.outputs.report_url }}" >> "$GITHUB_STEP_SUMMARY"
