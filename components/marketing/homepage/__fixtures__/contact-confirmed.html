<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact form with confirmation · FixFlags controlled demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f1;color:#171719;font:15px/1.5 system-ui,sans-serif}header{height:68px;padding:0 34px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dedbd5;background:#fff}header strong{font-size:18px}nav{display:flex;gap:22px;font-size:12px;color:#62656b}main{display:grid;grid-template-columns:.82fr 1.18fr;min-height:372px}.copy{padding:54px 34px;background:#e5e8de}.eyebrow{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#6d7069}h1{max-width:270px;margin:14px 0 18px;font-size:40px;line-height:1.04;letter-spacing:-1.8px}p{max-width:290px;margin:0;color:#60636a;font-size:13px}.form-wrap{padding:34px;background:#fff}.form{padding:25px;border:1px solid #dedbd5;border-radius:12px;box-shadow:0 14px 35px #1717190d}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;margin-bottom:6px;font-size:10px;font-weight:650;color:#62656b}input,textarea{width:100%;border:1px solid #d1cec8;border-radius:7px;background:#fff;padding:10px 11px;font:12px system-ui,sans-serif;color:#171719}textarea{height:70px;resize:none}.field{margin-top:12px}.button{display:inline-flex;align-items:center;min-height:38px;margin-top:15px;padding:0 16px;border-radius:7px;background:#171719;color:#fff;font-size:11px;font-weight:650}.status{min-height:34px;margin-top:11px;border:1px solid #71a67b;border-radius:6px;background:#eff8f0;color:#286236;font-size:11px;font-weight:650;display:flex;align-items:center;padding:0 10px}.status:before{content:"✓";display:grid;place-items:center;width:17px;height:17px;margin-right:7px;border-radius:50%;background:#3f8b50;color:#fff;font-size:10px}.status:after{content:"Message received"}
</style>
</head>
<body>
<header><strong>Everyday goods</strong><nav><span>Shop</span><span>Journal</span><span>Contact</span></nav></header>
<main>
  <section class="copy"><span class="eyebrow">We are here to help</span><h1>Send us a message.</h1><p>Ask about an order, a product, or anything else. We usually reply within one working day.</p></section>
  <section class="form-wrap"><div class="form"><div class="row"><div><label>Name</label><input value="Alex Morgan"></div><div><label>Email</label><input value="alex@example.com"></div></div><div class="field"><label>Message</label><textarea>Could you help me with my order?</textarea></div><span class="button">Send message</span><div class="status"></div></div></section>
</main>
</body>
</html>
