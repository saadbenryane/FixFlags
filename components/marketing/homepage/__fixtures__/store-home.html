<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everyday Goods</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #f6f6f4; color: #111113; font: 16px/1.4 Inter, "Helvetica Neue", sans-serif; }
  header {
    height: 60px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border-bottom: 1px solid #e5e5e2;
  }
  .mark { font-size: 16px; font-weight: 750; letter-spacing: -0.035em; }
  .cart-link { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 650; }
  .badge { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #ff5a00; color: #fff; font-size: 13px; font-weight: 750; }
  .hero { padding: 28px 20px 8px; }
  .eyebrow { margin: 0; color: #ff5a00; font-size: 11px; font-weight: 700; }
  h1 { margin: 8px 0 0; font-size: 34px; line-height: 1.02; letter-spacing: -0.05em; }
  .lede { margin: 10px 0 0; color: #66666c; font-size: 13px; }
  .shop { padding: 18px 14px 0; }
  .shop h2 { margin: 0 6px 10px; font-size: 13px; font-weight: 700; }
  .card { display: block; color: inherit; text-decoration: none; overflow: hidden; border-radius: 16px; background: #fff; box-shadow: 0 10px 30px rgba(17, 17, 19, 0.06); }
  .card img { display: block; width: 100%; height: 320px; object-fit: cover; object-position: 60% 50%; }
  .card-body { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 16px; }
  .card-body strong { display: block; font-size: 17px; letter-spacing: -0.02em; }
  .card-body span { color: #66666c; font-size: 12px; }
  .view { display: grid; place-items: center; height: 38px; padding: 0 16px; border-radius: 999px; background: #111113; color: #fff !important; font-size: 12px; font-weight: 700; }
  .note { margin: 14px 20px 0; color: #8b8b8f; font-size: 11px; }
</style>
</head>
<body>
<header>
  <strong class="mark">Everyday Goods</strong>
  <span class="cart-link">Cart <span class="badge">0</span></span>
</header>
<main>
  <section class="hero">
    <p class="eyebrow">Made for the everyday</p>
    <h1>Useful things, thoughtfully made.</h1>
    <p class="lede">Simple essentials that last.</p>
  </section>
  <section class="shop">
    <h2>New this week</h2>
    <a class="card" id="product-card">
      <img src="../../../../public/marketing/evidence/everyday-tote-lifestyle-v2.webp" alt="Canvas tote on a sunlit shelf">
      <div class="card-body"><div><strong>Canvas Tote</strong><span>Heavyweight cotton · $48</span></div><b class="view" id="view">View</b></div>
    </a>
  </section>
  <p class="note">Free delivery over $60</p>
</main>
</body>
</html>
