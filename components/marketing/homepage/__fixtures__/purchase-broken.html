<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Tote · Everyday Goods</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #f3efe7;
    color: #1c1915;
    font: 16px/1.4 "Avenir Next", "Segoe UI", sans-serif;
  }
  header {
    height: 64px;
    padding: 0 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fffdf8;
    border-bottom: 1px solid #e4ddd2;
  }
  .mark { font-family: Georgia, "Iowan Old Style", serif; font-size: 18px; letter-spacing: -0.03em; }
  .cart-link { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; }
  .badge {
    display: grid;
    place-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #ff5a00;
    color: #fff;
    font-size: 13px;
    font-weight: 750;
  }
  .stage { padding: 16px 16px 0; }
  .photo {
    height: 132px;
    border-radius: 16px;
    background:
      radial-gradient(circle at 50% 42%, #f7f1e4 0 46px, transparent 47px),
      linear-gradient(#efe7d8, #e7dfd0);
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
  }
  .bag { width: 92px; height: 108px; position: relative; }
  .bag i {
    position: absolute;
    left: 22px;
    top: 0;
    width: 48px;
    height: 28px;
    border: 4px solid #2c2824;
    border-bottom: 0;
    border-radius: 24px 24px 0 0;
  }
  .bag b {
    position: absolute;
    left: 8px;
    top: 22px;
    width: 76px;
    height: 82px;
    border-radius: 8px 8px 14px 14px;
    background: #d7c4a4;
    box-shadow: inset 0 0 0 2px #2c2824;
  }
  .bag b::after {
    content: "";
    position: absolute;
    left: 18px;
    right: 18px;
    top: 28px;
    height: 28px;
    border-top: 2px solid #2c2824;
    border-bottom: 2px solid #2c2824;
  }
  .buy { margin-top: 14px; }
  .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #6f675c; }
  h1 { margin: 4px 0 0; font-family: Georgia, serif; font-size: 32px; line-height: 1; letter-spacing: -0.04em; }
  .price { margin: 8px 0 0; font-size: 20px; font-weight: 700; }
  .button {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    margin-top: 12px;
    border-radius: 12px;
    background: #1c1915;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
  }
  .miss {
    margin-top: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: #fff;
    border: 1.5px solid #ff5a00;
    color: #9a3412;
    font-size: 13px;
    font-weight: 700;
  }
  .sheet {
    margin-top: 12px;
    min-height: 0;
    padding: 16px 16px 88px;
    border-radius: 22px 22px 0 0;
    background: #fff;
    box-shadow: 0 -12px 40px rgba(28, 25, 21, 0.08);
  }
  .sheet-top { display: flex; align-items: baseline; justify-content: space-between; }
  .sheet h2 { margin: 0; font-size: 18px; }
  .zero {
    margin: 16px 0 0;
    font-family: Georgia, serif;
    font-size: 64px;
    line-height: 0.85;
    letter-spacing: -0.06em;
  }
  .empty {
    margin: 8px 0 0;
    font-size: 26px;
    line-height: 1.15;
    letter-spacing: -0.03em;
    font-weight: 750;
  }
  .why { margin: 8px 0 0; max-width: 280px; color: #5e574e; font-size: 15px; }
  .closed {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    margin-top: 22px;
    border-radius: 12px;
    background: #f3efe7;
    color: #8a8176;
    font-size: 14px;
    font-weight: 700;
  }
</style>
</head>
<body>
<header>
  <strong class="mark">Everyday Goods</strong>
  <span class="cart-link">Cart <span class="badge">0</span></span>
</header>
<main>
  <section class="stage">
    <div class="photo" aria-hidden="true"><span class="bag"><i></i><b></b></span></div>
    <div class="buy">
      <p class="eyebrow">Everyday essentials</p>
      <h1>Canvas Tote</h1>
      <p class="price">$48</p>
      <div class="button">Add to cart</div>
      <p class="miss">Selected. Nothing was added.</p>
    </div>
  </section>
  <section class="sheet">
    <div class="sheet-top"><h2>Your cart</h2><span>0 items</span></div>
    <p class="zero">0</p>
    <p class="empty">Your cart is still empty.</p>
    <p class="why">Add to cart responded. The Canvas Tote never appeared.</p>
    <div class="closed">Checkout stays closed</div>
  </section>
</main>
</body>
</html>
