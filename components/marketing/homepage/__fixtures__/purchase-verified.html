<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Tote in cart · Everyday Goods</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #f6f6f4; color: #111113; font: 16px/1.4 Inter, "Helvetica Neue", sans-serif; }
  header {
    height: 60px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border-bottom: 1px solid #e5e5e2;
  }
  .mark { font-size: 16px; font-weight: 750; letter-spacing: -0.035em; }
  .cart-link { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 650; }
  .badge {
    display: grid;
    place-items: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #1c1915;
    color: #fff;
    font-size: 13px;
    font-weight: 750;
  }
  .stage { padding: 14px 14px 0; }
  .photo {
    height: 230px;
    border-radius: 14px;
    background: #eeeae2;
    overflow: hidden;
  }
  .photo img { width: 100%; height: 100%; display: block; object-fit: cover; object-position: center 54%; }
  .buy { margin-top: 14px; }
  .eyebrow { margin: 0; font-size: 10px; font-weight: 650; letter-spacing: 0.07em; color: #747478; }
  .product-line { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-top: 3px; }
  h1 { margin: 0; font-size: 29px; line-height: 1.05; letter-spacing: -0.045em; }
  .price { margin: 0; font-size: 17px; font-weight: 700; }
  .meta { margin: 6px 0 0; color: #66666c; font-size: 11px; }
  .button {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 48px;
    margin-top: 11px;
    border-radius: 10px;
    background: #111113;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
  }
  .ok {
    margin-top: 9px;
    padding: 9px 11px;
    border-radius: 10px;
    background: #e8f6ec;
    color: #166534;
    font-size: 12px;
    font-weight: 700;
  }
  .sheet {
    margin-top: 10px;
    min-height: 0;
    padding: 15px 16px 72px;
    border-radius: 18px 18px 0 0;
    background: #fff;
    box-shadow: 0 -10px 32px rgba(17, 17, 19, 0.06);
  }
  .sheet-top { display: flex; align-items: baseline; justify-content: space-between; }
  .sheet h2 { margin: 0; font-size: 18px; }
  .line {
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 12px;
    align-items: center;
    margin-top: 14px;
    padding-bottom: 13px;
    border-bottom: 1px solid #eee8df;
  }
  .thumb {
    width: 56px;
    height: 56px;
    border-radius: 9px;
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: center 58%; }
  .line strong { display: block; font-size: 15px; }
  .line span { color: #6f675c; font-size: 13px; }
  .checkout {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 46px;
    margin-top: 14px;
    border-radius: 10px;
    background: #111113;
    color: #fff;
    font-size: 14px;
    font-weight: 750;
  }
  .total { display: flex; justify-content: space-between; margin-top: 12px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <strong class="mark">Everyday Goods</strong>
  <span class="cart-link">Cart <span class="badge">1</span></span>
</header>
<main>
  <section class="stage">
    <div class="photo"><img src="../../../../public/marketing/evidence/everyday-tote-product-v2.webp" alt="Natural canvas tote photographed on a stone plinth"></div>
    <div class="buy">
      <p class="eyebrow">Everyday series</p>
      <div class="product-line"><h1>Canvas Tote</h1><p class="price">$48</p></div>
      <p class="meta">Heavyweight cotton · Natural</p>
      <div class="button">Added to cart</div>
      <p class="ok">1 item is in the cart.</p>
    </div>
  </section>
  <section class="sheet">
    <div class="sheet-top"><h2>Your cart</h2><span>1 item</span></div>
    <div class="line">
      <span class="thumb"><img src="../../../../public/marketing/evidence/everyday-tote-product-v2.webp" alt=""></span>
      <div><strong>Canvas Tote</strong><span>Quantity 1</span></div>
      <b>$48</b>
    </div>
    <div class="total"><span>Subtotal</span><b>$48</b></div>
    <div class="checkout">Checkout</div>
  </section>
</main>
</body>
</html>
