# Shopify app config. Client ID is filled by the operator in Partner Dashboard
# and `shopify app deploy`. Do not commit secrets.
name = "FixFlags"
application_url = "https://fixflags.com/shopify"
embedded = true

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = [
  "https://fixflags.com/api/shopify/callback",
]

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/api/shopify/webhooks"

  [[webhooks.subscriptions]]
  topics = ["products/update"]
  uri = "/api/shopify/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/api/shopify/webhooks"
