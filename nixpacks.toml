# Chromium/Puppeteer runtime deps. Package names target Ubuntu 24.04 "noble"
# (Railway's Nixpacks base), where several libs gained the t64 suffix and
# libappindicator3-1 was dropped.
[phases.setup]
aptPkgs = [
  "fonts-liberation",
  "libasound2t64",
  "libatk-bridge2.0-0t64",
  "libatk1.0-0t64",
  "libcups2t64",
  "libgbm1",
  "libgtk-3-0t64",
  "libnspr4",
  "libnss3",
  "libx11-xcb1",
  "libxcomposite1",
  "libxcursor1",
  "libxdamage1",
  "libxfixes3",
  "libxi6",
  "libxrandr2",
  "libxss1",
  "libxtst6",
  "xdg-utils"
]
