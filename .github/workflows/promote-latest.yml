name: Promote to Latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (e.g., 1.0.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  promote:
    name: Promote to latest
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-capable npm
        run: npm install --global npm@latest
      - name: Promote to latest
        run: npm dist-tag add fixflags@${{ github.event.inputs.version }} latest