name: Publish FixFlags CLI

on:
  push:
    tags:
      - 'fixflags-cli-v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fixflags-cli/package-lock.json
      - run: npm ci
        working-directory: fixflags-cli
      - run: npm test
        working-directory: fixflags-cli
      - run: npm run package:check
        working-directory: fixflags-cli
      - name: Clean-install packed CLI
        shell: bash
        run: node scripts/verify-cli-package.mjs

  publish:
    name: Publish with trusted publishing
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install OIDC-capable npm
        run: npm install --global npm@latest
      - run: npm ci
        working-directory: fixflags-cli
      - name: Get package version
        id: pkgver
        run: echo "version=$(node -p "require('./fixflags-cli/package.json').version")" >> $GITHUB_OUTPUT
      - name: Match tag to package version
        shell: bash
        run: |
          EXPECTED="fixflags-cli-v${{ steps.pkgver.outputs.version }}"
          test "${GITHUB_REF_NAME}" = "${EXPECTED}"
      - name: Detect prerelease
        id: prerelease
        run: |
          VERSION="${{ steps.pkgver.outputs.version }}"
          if echo "$VERSION" | grep -q -- '-'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi
      - name: Publish beta
        if: steps.prerelease.outputs.is_prerelease == 'true'
        run: npm publish --tag beta --access public
        working-directory: fixflags-cli
      - name: Publish stable
        if: steps.prerelease.outputs.is_prerelease == 'false'
        run: npm publish --tag latest --access public
        working-directory: fixflags-cli
      - name: Verify registry availability
        run: node scripts/verify-cli-registry.mjs --version "${{ steps.pkgver.outputs.version }}"