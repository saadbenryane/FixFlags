name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixflags
          POSTGRES_PASSWORD: fixflags
          POSTGRES_DB: fixflags_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      DATABASE_URL: postgresql://fixflags:fixflags@127.0.0.1:5432/fixflags_test
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      REDIS_URL: redis://127.0.0.1:6379
      E2E_FULL: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run brand:hex-guard

      - run: npm run ui:drift-guard

      - run: npm run product:contract-guard

      - run: npm run seo:guard

      - run: npm run knowledge:duplication-guard

      - run: npm run audit:capabilities

      - run: npm run test:unit

      - run: npm run test:cli

      - run: npm run build

      - run: npm run worker:build

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e
