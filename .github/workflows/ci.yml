name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixflags
          POSTGRES_PASSWORD: fixflags
          POSTGRES_DB: fixflags
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixflags -d fixflags"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://fixflags:fixflags@localhost:5432/fixflags
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-test-secret-minimum-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      OPENAI_API_KEY: sk-test
      CRON_SECRET: ci-cron-secret
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      RESEND_API_KEY: re_ci
      RESEND_FROM_EMAIL: FixFlags <noreply@example.com>
      SAMPLE_AUDIT_URL: https://example.com
      R2_BUCKET_NAME: fixflags-ci
      R2_ACCOUNT_ID: ci-account
      R2_ACCESS_KEY_ID: ci-access
      R2_SECRET_ACCESS_KEY: ci-secret
      R2_PUBLIC_URL: https://assets.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run db:generate
      - name: Apply migrations to existing database
        run: npm run db:deploy
      - name: Verify migration status
        run: npm run db:check
      - name: Verify migrations against a fresh database
        run: |
          PGPASSWORD=fixflags psql -h localhost -U fixflags -d postgres -c 'CREATE DATABASE fixflags_fresh'
          DATABASE_URL=postgresql://fixflags:fixflags@localhost:5432/fixflags_fresh npm run db:deploy
          PGPASSWORD=fixflags psql -h localhost -U fixflags -d postgres -c 'DROP DATABASE fixflags_fresh'
      - run: npm run verify
