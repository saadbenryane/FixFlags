name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
        env:
          DATABASE_URL: postgresql://qualityos:qualityos@localhost:5432/qualityos
          REDIS_URL: redis://localhost:6379
          BETTER_AUTH_SECRET: ci-test-secret-minimum-32-chars
          BETTER_AUTH_URL: http://localhost:3000
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test
