name: Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  recover-stuck-audits:
    runs-on: ubuntu-latest
    steps:
      - name: Call recover-stuck-audits
        run: |
          curl -sf -X GET "${{ secrets.APP_URL }}/api/cron/recover-stuck-audits" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
