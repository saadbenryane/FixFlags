# Recovery cron service — same image as web/worker, runs on a schedule and exits.
# This removes the dependency on GitHub Actions (.github/workflows/cron.yml) for
# recovering stuck audits in production.
#
# In Railway: create a service from this repo, set its Config path to
# /railway.cron.toml, and provide env vars:
#   APP_URL      = internal/public URL of the web service
#                  (e.g. http://<web>.railway.internal:8080)
#   CRON_SECRET  = same value as the web service
#
# The cronSchedule makes Railway run the start command every 5 minutes; the
# command triggers recovery and exits, so the restart policy is NEVER.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/bin/sh -c \"node scripts/trigger-cron.mjs /api/cron/recover-stuck-audits\""
cronSchedule = "*/5 * * * *"
restartPolicyType = "NEVER"
