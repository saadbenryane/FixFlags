[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[deploy.env]
HOSTNAME = "0.0.0.0"
FIXFLAGS_PROCESS_ROLE = "web"

# The web service only serves HTTP and enqueues scans. A separate service using
# railway.worker.toml is required to process the audit queue.
